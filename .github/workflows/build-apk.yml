name: Build Pixvid Lab & Pixvid Admin APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    working-directory: pixprompt-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build User App & Admin App debug APKs
        run: gradle assembleDebug --stacktrace

      - name: Prepare named APK files
        run: |
          mkdir -p "${{ github.workspace }}/artifacts-ready"
          USER_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          ADMIN_APK=$(find admin-app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "User APK found at: $USER_APK"
          echo "Admin APK found at: $ADMIN_APK"
          if [ -n "$USER_APK" ] && [ -f "$USER_APK" ]; then
            cp "$USER_APK" "${{ github.workspace }}/artifacts-ready/Pixvid-Lab-User-v1.0.3.apk"
          else
            echo "Error: User APK not found!"
            find . -name "*.apk"
            exit 1
          fi
          if [ -n "$ADMIN_APK" ] && [ -f "$ADMIN_APK" ]; then
            cp "$ADMIN_APK" "${{ github.workspace }}/artifacts-ready/Pixvid-Admin-v1.0.1.apk"
          else
            echo "Error: Admin APK not found!"
            find . -name "*.apk"
            exit 1
          fi
          ls -lh "${{ github.workspace }}/artifacts-ready"

      - name: Upload Pixvid Lab (User App) APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixvid-Lab-User-APK
          path: artifacts-ready/Pixvid-Lab-User-v1.0.3.apk

      - name: Upload Pixvid Admin (Separate Admin App) APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixvid-Admin-APK
          path: artifacts-ready/Pixvid-Admin-v1.0.1.apk