name: Build Pixvid Lab & Pixvid Admin APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

defaults:
  run:
    working-directory: pixprompt-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build User App & Admin App debug APKs
        run: gradle assembleDebug --stacktrace

      - name: Upload Pixvid Lab (User App) APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixvid-Lab-User-APK
          path: pixprompt-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Pixvid Admin (Separate Admin App) APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixvid-Admin-APK
          path: pixprompt-app/admin-app/build/outputs/apk/debug/admin-app-debug.apk