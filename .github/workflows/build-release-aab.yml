name: Build Signed Release AAB (Play Store)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: pixprompt-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Decode keystore from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/pixprompt-app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixPrompt-release-aab
          path: pixprompt-app/app/build/outputs/bundle/release/app-release.aab

      - name: Clean up keystore file
        if: always()
        run: rm -f release.jks
